<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fig 3 — interactive G* explorer</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    :root {
      --ink: #1a1a1a;
      --muted: #555;
      --bg: #f7f7f5;
      --panel: #ffffff;
      --line: #ddd;
      --cl: #0072B2;
      --br: #E69F00;
      --neg: #d6e6f5;
      --pos: #f5d6d6;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    }
    .app {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100%;
    }
    header {
      padding: 0.85rem 1.25rem 0.7rem;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    header h1 {
      margin: 0 0 0.25rem;
      font-size: 1.05rem;
      font-weight: 650;
      letter-spacing: 0.01em;
    }
    header p {
      margin: 0;
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.35;
      max-width: 70rem;
    }
    #plot {
      width: 100%;
      height: 100%;
      min-height: 420px;
      background: var(--panel);
    }
    .status {
      position: absolute;
      right: 1rem;
      bottom: 0.75rem;
      font-size: 0.75rem;
      color: var(--muted);
      background: rgba(255,255,255,0.9);
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      border: 1px solid var(--line);
      pointer-events: none;
    }
    .wrap { position: relative; min-height: 0; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Fig 3 — G* at best T (interactive sketch)</h1>
      <p>
        Zoom/pan to separate points. Hover a marker for the MXene reaction, competing
        byproduct channel, and temperature. Encoding matches v4:
        shape = M<sub>2</sub>/M<sub>3</sub>/M<sub>4</sub>,
        color = Cl/Br,
        fill = C / open = N
        (C dodged left, N right within each metal).
      </p>
    </header>
    <div class="wrap">
      <div id="plot"></div>
      <div class="status" id="status">Loading…</div>
    </div>
  </div>

  <!-- data.embedded.js first so file:// opens work without a local server -->
  <script src="./data.embedded.js"></script>
  <script>
    const COLOR = { Cl: "#0072B2", Br: "#E69F00" };
    const SYMBOL = { M2: "circle", M3: "triangle-up", M4: "square" };
    const G_LIM = 500;

    function metalIndex(metals, metal) {
      return metals.indexOf(metal);
    }

    function pointX(metals, p, jitter) {
      const i = metalIndex(metals, p.metal);
      const dodge = p.X === "C" ? -0.14 : 0.14;
      return i + dodge + (jitter || 0);
    }

    function buildTraces(data) {
      const metals = data.metals;
      const traces = [];
      // Draw open (N) under filled (C)
      const order = [
        ["N", false],
        ["C", true],
      ];
      for (const [xAtom, filled] of order) {
        for (const layer of ["M2", "M3", "M4"]) {
          for (const term of ["Cl", "Br"]) {
            const pts = data.points.filter(
              (p) => p.X === xAtom && p.layer === layer && p.term === term
            );
            if (!pts.length) continue;
            const color = COLOR[term];
            traces.push({
              type: "scatter",
              mode: "markers",
              name: `${layer} · ${xAtom} · ${term}`,
              legendgroup: `${layer}-${xAtom}-${term}`,
              x: pts.map((p) => pointX(metals, p, p._jitter)),
              y: pts.map((p) => p.G_star_kJ),
              customdata: pts.map((p) => [
                p.mxene_formula || "",
                p.mxene_reaction || "",
                p.byproduct_formula || "",
                p.byproduct_reaction || "",
                p.T_K,
                p.G_star_kJ,
                p.family || "",
                p.metal || "",
              ]),
              hovertemplate:
                "<b>%{customdata[0]}</b> (%{customdata[6]})<br>" +
                "<b>MXene reaction</b><br>%{customdata[1]}<br>" +
                "<b>Byproduct</b> %{customdata[2]}<br>%{customdata[3]}<br>" +
                "<b>T</b> %{customdata[4]:.0f} K<br>" +
                "<b>G*</b> %{customdata[5]:.1f} kJ" +
                "<extra></extra>",
              marker: {
                symbol: SYMBOL[layer],
                size: 9,
                color: filled ? color : "rgba(0,0,0,0)",
                line: { color: color, width: filled ? 0.6 : 1.6 },
                opacity: filled ? 0.7 : 0.85,
              },
            });
          }
        }
      }
      return traces;
    }

    function layout(metals) {
      const tickvals = metals.map((_, i) => i);
      return {
        margin: { l: 60, r: 20, t: 18, b: 55 },
        paper_bgcolor: "#ffffff",
        plot_bgcolor: "#ffffff",
        hovermode: "closest",
        dragmode: "zoom",
        xaxis: {
          title: { text: "Metal core (by atomic number)", standoff: 8 },
          tickmode: "array",
          tickvals,
          ticktext: metals,
          tickfont: { size: 12, family: "IBM Plex Sans, sans-serif", weight: 600 },
          range: [-0.7, metals.length - 0.3],
          zeroline: false,
          gridcolor: "rgba(0,0,0,0.08)",
          showline: true,
          linecolor: "#333",
        },
        yaxis: {
          title: { text: "G* (kJ)  [negative up]", standoff: 6 },
          range: [G_LIM, -G_LIM], // inverted: negative at top
          zeroline: false,
          gridcolor: "rgba(0,0,0,0.08)",
          showline: true,
          linecolor: "#333",
        },
        shapes: [
          {
            type: "rect",
            xref: "paper",
            yref: "y",
            x0: 0,
            x1: 1,
            y0: 0,
            y1: -G_LIM,
            fillcolor: "#d6e6f5",
            line: { width: 0 },
            layer: "below",
          },
          {
            type: "rect",
            xref: "paper",
            yref: "y",
            x0: 0,
            x1: 1,
            y0: G_LIM,
            y1: 0,
            fillcolor: "#f5d6d6",
            line: { width: 0 },
            layer: "below",
          },
          {
            type: "line",
            xref: "paper",
            yref: "y",
            x0: 0,
            x1: 1,
            y0: 0,
            y1: 0,
            line: { color: "#222", width: 1.2, dash: "dash" },
          },
        ],
        legend: {
          orientation: "h",
          y: 1.08,
          font: { size: 10 },
        },
      };
    }

    const config = {
      responsive: true,
      displaylogo: false,
      modeBarButtonsToRemove: ["lasso2d", "select2d"],
      toImageButtonOptions: {
        format: "png",
        filename: "Fig3_Gstar_interactive",
        scale: 2,
      },
    };

    async function loadData() {
      // Website path: fetch JSON. Local sketch: embedded FIG3_DATA.
      if (window.FIG3_DATA) return window.FIG3_DATA;
      const res = await fetch("./data.json", { cache: "no-store" });
      if (!res.ok) throw new Error("Failed to load data.json");
      return await res.json();
    }

    function addJitter(points, seed = 2) {
      // Small deterministic jitter so zoom reveals separation without moving chemistry.
      let s = seed >>> 0;
      const rnd = () => {
        s = (s * 1664525 + 1013904223) >>> 0;
        return (s / 0xffffffff) * 2 - 1;
      };
      for (const p of points) {
        p._jitter = rnd() * 0.16;
      }
    }

    async function main() {
      const status = document.getElementById("status");
      try {
        const data = await loadData();
        addJitter(data.points);
        const traces = buildTraces(data);
        const lay = layout(data.metals);
        await Plotly.newPlot("plot", traces, lay, config);
        status.textContent =
          `${data.points.length.toLocaleString()} reactions · ` +
          `box-zoom / scroll · double-click reset · hover for reaction + T`;
      } catch (err) {
        status.textContent = String(err);
        console.error(err);
      }
    }

    main();
  </script>
</body>
</html>
